[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpha-research"
version = "0.1.0"
description = "Reproducible cross-sectional TWSE equity alpha research"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.2,<3", "pandas>=2.2,<4", "pyarrow>=19,<24",
  "requests>=2.32,<3", "scikit-learn>=1.6,<2",
  "lightgbm>=4.6,<5", "matplotlib>=3.10,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
alpha-research = "alpha_research.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

